# Opening braces and physical method limits are checked with SwiftSyntax instead.
# Only the active prototype sources are passed to lint; pending-deletion files stay untouched.
only_rules:
  - force_cast
  - force_try
  - force_unwrapping
  - file_length
  - function_body_length
  - trailing_whitespace
  - vertical_whitespace
  - colon
  - comma
  - return_arrow_whitespace
file_length:
  warning: 250
  error: 250
  ignore_comment_only_lines: false
function_body_length:
  warning: 50
  error: 50
