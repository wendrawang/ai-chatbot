# Packages/ rather than one package by name, so a package added later is
# linted the day it appears.
included:
  - TanyaAISandboxApp
  - TanyaAISandboxUITests
  - Packages

excluded:
  - .build
  - DerivedData
  - Packages/TanyaAI/.build
  - Packages/TanyaAI/.swiftpm
  - Packages/DesignKit/.build
  - Packages/DesignKit/.swiftpm

file_length:
  warning: 250
  error: 250
  ignore_comment_only_lines: true

function_body_length:
  warning: 40
  error: 60

identifier_name:
  min_length:
    warning: 3
    error: 3
  max_length:
    warning: 40
    error: 40
  excluded:
    - id

type_name:
  max_length:
    warning: 40
    error: 40
