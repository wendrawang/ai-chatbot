# Packages/ rather than one package by name, so a package added later is
# linted the day it appears.
included:
  - TanyaAISandboxApp
  - TanyaAISandboxUITests
  - Packages
  - Examples
  - Scripts

excluded:
  - .build
  - DerivedData
  - Packages/DesignKit/Sources/DesignKit/Tokens/Generated
  - Packages/TanyaAI/.build
  - Packages/TanyaAI/.swiftpm
  - Packages/DesignKit/.build
  - Packages/DesignKit/.swiftpm

file_length:
  warning: 250
  error: 250
  ignore_comment_only_lines: false

function_body_length:
  warning: 50
  error: 50

identifier_name:
  min_length:
    warning: 3
    error: 3
  max_length:
    warning: 35
    error: 35

type_name:
  max_length:
    warning: 40
    error: 40

custom_rules:
  boolean_prefix:
    name: "Boolean prefix"
    regex: '\b(?!is[A-Z])\w+\s*:\s*Bool\b|\b(?:let|var)\s+(?!is[A-Z])\w+\s*=\s*(?:true|false)\b'
    message: "Boolean variables must start with is."
    severity: error
